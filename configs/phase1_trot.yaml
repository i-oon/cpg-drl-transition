# Phase 1 – Trot: two-state indirect encoding, diagonal pairs, cosine init

cpg:
  alpha: 1.01
  freq_train: 1.0   # Hz
  dt: 0.02

rbf:
  num_neurons: 20
  variance: 0.04

gait:
  name: trot
  cpg_reversed: true   # trot = diagonal pairs (FL+RR, FR+RL)

pibb:
  init_mode: cosine
  max_w_norm: 2.0
  exploration_noise: 0.19   # std = sqrt(0.036) matching online-locomotion-rl
  noise_decay_rate: 0.998
  temperature: 10.0
  init_var_boost: 1.5
  max_iterations: 500
  convergence_threshold: 0.001

reward:
  w_forward:   1.5
  w_lateral:   1.0
  w_stability: 1.0
  w_contact:   1.0
  height_nominal: 0.55

env:
  num_envs: 64
  episode_length: 400   # 8 s at 50 Hz — prevents overfitting to short sprints
  robot: unitree_b1
  terrain: flat

logging:
  log_dir: logs/phase1
  run_name: trot
  save_interval: 50
  log_interval: 10

output:
  weights_path: weights/W_trot.npy
