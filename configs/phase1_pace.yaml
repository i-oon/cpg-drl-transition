# Phase 1 – Pace: lateral pairs (FL+RL, FR+RR)

cpg:
  alpha: 1.01
  freq_train: 1.0
  dt: 0.02

rbf:
  num_neurons: 20
  variance: 0.04

gait:
  name: pace
  cpg_reversed: false   # pace = lateral pairs — default two-state encoding

pibb:
  init_mode: cosine
  exploration_noise: 0.19
  noise_decay_rate: 0.992
  temperature: 10.0
  init_var_boost: 1.5
  max_iterations: 151
  convergence_threshold: 0.001

reward:
  w_forward:   1.5
  w_lateral:   1.0
  w_stability: 1.0
  w_contact:   1.0
  height_nominal: 0.55

env:
  num_envs: 15
  episode_length: 150
  robot: unitree_b1
  terrain: flat

logging:
  log_dir: logs/phase1
  run_name: pace
  save_interval: 50
  log_interval: 10

output:
  weights_path: weights/W_pace.npy
