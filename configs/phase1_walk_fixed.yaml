# Phase 1 – Walk (fixed): all bugs corrected, real robot joint angles

cpg:
  alpha: 1.01
  freq_train: 1.0
  dt: 0.02

rbf:
  num_neurons: 20
  variance: 0.04

gait:
  name: walk
  cpg_reversed: false

pibb:
  init_mode: cosine
  cosine_thigh_amp: 0.20
  cosine_calf_amp:  0.16
  exploration_noise: 0.19
  noise_decay_rate: 0.992
  temperature: 10.0
  init_var_boost: 1.5
  max_iterations: 151
  convergence_threshold: 0.001

reward:
  w_forward:   1.5
  w_lateral:   1.0
  w_stability: 1.0
  w_contact:   1.0
  height_nominal: 0.55

env:
  num_envs: 15
  episode_length: 150
  robot: unitree_b1
  terrain: flat

logging:
  log_dir: logs/phase1_cpg_fixed
  run_name: walk_fixed
  save_interval: 50
  log_interval: 10

output:
  weights_path: weights/W_walk_fixed.npy
